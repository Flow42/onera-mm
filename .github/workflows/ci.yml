name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run is wasted CI time and delays the useful one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 7-Zip is a runtime dependency of the archive backend's external path.
      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # `missing_docs` is warned-on in the crates; this makes it fail the build.
      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  desktop:
    name: Desktop crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # The Tauri crate is outside the Cargo workspace precisely so the job
      # above does not need these.
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Formatting
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

  frontend:
    name: Frontend and extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # SvelteKit generates the tsconfig the type checker extends.
      - run: pnpm --filter onera-desktop exec svelte-kit sync

      - name: Lint
        run: pnpm exec eslint .

      - name: Formatting
        run: pnpm exec prettier --check .

      - name: Types
        run: pnpm --filter onera-desktop exec svelte-check --tsconfig ./tsconfig.json

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm --filter onera-desktop build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust advisories, licences and bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Node advisories
        # `--prod` only: a dev-only advisory should not block a release, but it
        # is still reported in the log.
        run: pnpm audit --prod --audit-level moderate
