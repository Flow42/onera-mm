name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: AppImage and .deb
    runs-on: ubuntu-22.04 # oldest supported glibc, for portability
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf p7zip-full

      - run: pnpm install --frozen-lockfile

      # The Native Messaging host is bundled into the package, so it has to
      # exist before the bundler runs.
      - name: Build the native messaging host and CLI
        run: cargo build --release -p onera-nmhost -p onera-cli

      - name: Bundle
        run: pnpm tauri build

      - name: Smoke-test the CLI
        run: ./target/release/onera --version

      # The extension has no build step — it is loaded as-is — so the release
      # artifact is the source directory, zipped. `-X` drops the extra file
      # attributes that would otherwise make two builds of identical files
      # differ; the entries are sorted for the same reason.
      - name: Package the browser extension
        run: |
          version=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          (cd extension && find . -type f | LC_ALL=C sort \
            | zip -X -q "$GITHUB_WORKSPACE/onera-extension-$version.zip" -@)
          unzip -l "onera-extension-$version.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: onera-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            target/release/onera
            target/release/onera-nmhost
            onera-extension-*.zip

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            target/release/onera
            target/release/onera-nmhost
            onera-extension-*.zip
