name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: AppImage and .deb
    runs-on: ubuntu-22.04 # oldest supported glibc, for portability
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf p7zip-full

      - run: pnpm install --frozen-lockfile

      # The Native Messaging host is bundled into the package, so it has to
      # exist before the bundler runs.
      - name: Build the native messaging host and CLI
        run: cargo build --release -p onera-nmhost -p onera-cli

      - name: Bundle
        run: pnpm tauri build

      - name: Smoke-test the CLI
        run: ./target/release/onera --version

      - uses: actions/upload-artifact@v4
        with:
          name: onera-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            target/release/onera

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
