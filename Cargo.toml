[workspace]
resolver = "2"
members = [
    "crates/onera-core",
    "crates/onera-db",
    "crates/onera-archive",
    "crates/onera-install",
    "crates/onera-discovery",
    "crates/onera-games",
    "crates/onera-provider",
    "crates/onera-resolver",
    "crates/onera-nexus",
    "crates/onera-download",
    "crates/onera-app",
    "crates/onera-cli",
    "crates/onera-nmhost",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/onera-mm/onera"
authors = ["Onera contributors"]

[workspace.dependencies]
onera-core = { path = "crates/onera-core", version = "0.1.0" }
onera-db = { path = "crates/onera-db", version = "0.1.0" }
onera-archive = { path = "crates/onera-archive", version = "0.1.0" }
onera-install = { path = "crates/onera-install", version = "0.1.0" }
onera-discovery = { path = "crates/onera-discovery", version = "0.1.0" }
onera-games = { path = "crates/onera-games", version = "0.1.0" }
onera-provider = { path = "crates/onera-provider", version = "0.1.0" }
onera-resolver = { path = "crates/onera-resolver", version = "0.1.0" }
onera-nexus = { path = "crates/onera-nexus", version = "0.1.0" }
onera-download = { path = "crates/onera-download", version = "0.1.0" }
onera-app = { path = "crates/onera-app", version = "0.1.0" }

anyhow = "1"
async-trait = "0.1"
blake3 = "1"
bytes = "1"
camino = { version = "1", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
keyring = { version = "3", features = ["linux-native-sync-persistent", "sync-secret-service"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "macros", "migrate"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
flate2 = "1"
xz2 = "0.1"

# dev
proptest = "1"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
