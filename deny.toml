# Dependency policy, enforced by `cargo deny check` in CI.

[advisories]
# Any unpatched advisory in the dependency graph fails the build. A mod manager
# that unpacks untrusted archives has no business shipping a known-vulnerable
# decompressor.
yanked = "deny"

[licenses]
# Permissive licences only. Onera is dual MIT/Apache-2.0 and must stay
# redistributable in both AppImage and .deb form.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.deny]]
# `openssl-sys` would drag in a system OpenSSL and make the AppImage
# non-portable. Everything goes through rustls.
name = "openssl-sys"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
