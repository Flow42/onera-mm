<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Onera</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 12px;
        font:
          13px/1.4 system-ui,
          sans-serif;
        background: #17171a;
        color: #f4f4f5;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .status {
        padding: 8px;
        border-radius: 6px;
        background: #232327;
        margin-bottom: 8px;
      }
      .error {
        color: #ffb4a8;
      }
      .app {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        color: #a1a1aa;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #a1a1aa;
        flex: none;
      }
      .dot.running {
        background: #9ece6a;
      }
      .dot.stopped {
        background: #e0af68;
      }
      button.primary {
        border-color: transparent;
        background: #7aa2f7;
        color: #10101a;
        font-weight: 600;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #2a2a30;
        color: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Onera</h1>
    <div class="app">
      <span class="dot" id="app-dot"></span><span id="app-state">Checking…</span>
    </div>
    <div class="status" id="status">Checking…</div>
    <button id="launch" hidden>Open Onera</button>
    <div id="actions" hidden></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
