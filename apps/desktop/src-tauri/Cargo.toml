[package]
name = "onera-desktop"
description = "The Onera desktop application"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# Deliberately outside the Cargo workspace: Tauri needs system libraries
# (webkit2gtk, libsoup) that a headless CI job building the core does not, so
# `cargo test --workspace` stays installable everywhere.

# The application is a library with a thin binary on top, so the compiled smoke
# suite can build the very same command surface the window registers.
[lib]
name = "onera_desktop"
path = "src/lib.rs"

[[bin]]
name = "onera-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
onera-app = { path = "../../../crates/onera-app" }
onera-archive = { path = "../../../crates/onera-archive" }
onera-core = { path = "../../../crates/onera-core" }
onera-discovery = { path = "../../../crates/onera-discovery" }
onera-games = { path = "../../../crates/onera-games" }
onera-install = { path = "../../../crates/onera-install" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1" }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
onera-db = { path = "../../../crates/onera-db" }
tauri = { version = "2", features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
