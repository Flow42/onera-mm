[package]
name = "onera-desktop"
description = "The Onera desktop application"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# Deliberately outside the Cargo workspace: Tauri needs system libraries
# (webkit2gtk, libsoup) that a headless CI job building the core does not, so
# `cargo test --workspace` stays installable everywhere.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
onera-app = { path = "../../../crates/onera-app" }
onera-archive = { path = "../../../crates/onera-archive" }
onera-core = { path = "../../../crates/onera-core" }
onera-discovery = { path = "../../../crates/onera-discovery" }
onera-games = { path = "../../../crates/onera-games" }
onera-install = { path = "../../../crates/onera-install" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1" }

[features]
custom-protocol = ["tauri/custom-protocol"]
